name: CSS bundles parity and browser appearance
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'css-bundle-*.css'
      - 'sw.js'
      - 'scripts/build-css-bundles.cjs'
      - 'tests/css-bundle-browser-compare.cjs'
      - '.github/workflows/css-bundle-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Confirm CSS bundles contain every original rule in the original order
        run: |
          node --check scripts/build-css-bundles.cjs
          node scripts/build-css-bundles.cjs --check
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start unmodified main and bundle preview on separate ports
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git worktree add --detach /tmp/placementatlas-css-baseline origin/main
          python3 -m http.server 8000 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >/tmp/placement-css-candidate.log 2>&1 &
          python3 -m http.server 8001 --bind 127.0.0.1 --directory /tmp/placementatlas-css-baseline >/tmp/placement-css-main.log 2>&1 &
      - name: Compare light and dark desktop/mobile computed styles
        run: node tests/css-bundle-browser-compare.cjs
