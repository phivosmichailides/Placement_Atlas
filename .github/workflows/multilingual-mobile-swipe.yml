name: Multilingual interface and mobile Swipe Mode regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'tinder-mode.js'
      - 'atlas-i18n.js'
      - 'atlas-i18n-parity.js'
      - 'atlas-i18n-quiz.js'
      - 'atlas-i18n-east-asia.js'
      - 'swipe-mobile-navigation.js'
      - 'swipe-mobile-workspace.css'
      - 'tests/multilingual-content-parity.test.cjs'
      - 'atlas-i18n.css'
      - 'swipe-mobile-viewport.css'
      - 'tests/multilingual-mobile-swipe.test.cjs'
      - '.github/workflows/multilingual-mobile-swipe.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'tinder-mode.js'
      - 'atlas-i18n.js'
      - 'atlas-i18n-parity.js'
      - 'atlas-i18n-quiz.js'
      - 'atlas-i18n-east-asia.js'
      - 'swipe-mobile-navigation.js'
      - 'swipe-mobile-workspace.css'
      - 'tests/multilingual-content-parity.test.cjs'
      - 'atlas-i18n.css'
      - 'swipe-mobile-viewport.css'
      - 'tests/multilingual-mobile-swipe.test.cjs'
      - '.github/workflows/multilingual-mobile-swipe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: node --check atlas-i18n.js && node --check atlas-i18n-parity.js && node --check atlas-i18n-quiz.js && node --check atlas-i18n-east-asia.js && node --check swipe-mobile-navigation.js && node --check tinder-mode.js && node --check sw.js
      - name: Verify language selector, swipe gestures and offline assets
        run: node --test tests/multilingual-mobile-swipe.test.cjs tests/multilingual-content-parity.test.cjs tests/swipe-mode-workspace-regression.test.cjs
