name: Placement Atlas performance lab
on:
  push:
    branches:
      - 'perf/**'
  workflow_dispatch:
jobs:
  lighthouse:
    name: Compare main against performance branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Lighthouse and Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1 lighthouse@13.5.0
          npx playwright install chromium --with-deps
      - name: Serve release baseline and candidate locally
        run: |
          git worktree add --detach /tmp/placement-atlas-baseline origin/main
          python3 -m http.server 8000 --bind 127.0.0.1 --directory . >/tmp/atlas-candidate-server.log 2>&1 &
          python3 -m http.server 8001 --bind 127.0.0.1 --directory /tmp/placement-atlas-baseline >/tmp/atlas-baseline-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8000/ && curl -fsS -o /dev/null http://127.0.0.1:8001/ && break; sleep 1; done
      - name: Lighthouse desktop and mobile (same runner)
        run: |
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          mkdir -p /tmp/atlas-lighthouse
          for mode in desktop mobile; do
            opt=""
            if [ "$mode" = desktop ]; then opt="--preset=desktop"; fi
            for version in baseline candidate; do
              port=8001
              if [ "$version" = candidate ]; then port=8000; fi
              echo "::group::Lighthouse $mode $version"
              ./node_modules/.bin/lighthouse "http://127.0.0.1:$port/" \
                --only-categories=performance --output=json \
                --output-path="/tmp/atlas-lighthouse/$mode-$version.json" \
                --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
                --max-wait-for-load=30000 --quiet $opt
              echo "::endgroup::"
            done
          done
          node tests/print-performance-audit.cjs /tmp/atlas-lighthouse
      - name: Retain Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: placement-atlas-pagespeed-lab
          path: /tmp/atlas-lighthouse/*.json
          if-no-files-found: ignore
          retention-days: 7
